map $http_origin $dagster_same_origin {
    default 0;
    "https://pr.digitie.mywire.org" 1;
    "http://127.0.0.1:14003" 1;
    "http://localhost:14003" 1;
}

map "$request_method:$dagster_same_origin" $dagster_csrf_block {
    default 0;
    "POST:0" 1;
}

server {
    listen 14003;
    server_name _;
    set $dagster_upstream http://127.0.0.1:14004;

    auth_basic "kor-travel-transport Dagster";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        if ($dagster_csrf_block) { return 403; }
        proxy_pass $dagster_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
