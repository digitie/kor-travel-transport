[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kor-travel-transport-backend"
version = "0.1.0"
description = "Integrated domestic travel transport data API"
requires-python = ">=3.12"
dependencies = [
  "kor-travel-common[dagster] @ git+https://github.com/digitie/kor-travel-common.git@430a9e9cd5429204579792b1d4f8e399366dcb2f#subdirectory=packages/py/kor-travel-common",
  "aiosqlite>=0.22,<1.0",
  "alembic>=1.19,<2.0",
  "asyncpg>=0.31,<1.0",
  "brotli>=1.1,<2.0",
  # Dagster 계열은 공용 Dagster 제어 평면의 호스트(Manager `docker/dagster-host`, 1.13.24)와 **같은 버전**으로 고정한다.
  # 공용 webserver는 code-server의 dagster가 호스트보다 높으면 unhealthy가 되고(전 테넌트), 배포·전환 스크립트는
  # 다르면 멈춘다. 호스트를 올릴 때 함께 올린다(uv.lock도).
  "dagster==1.13.24",
  "dagster-postgres==0.29.24",
  "dagster-webserver==1.13.24",
  "fastapi>=0.141,<1.0",
  "httpx>=0.28,<1.0",
  "python-datagokr-api @ git+https://github.com/digitie/python-datagokr-api@b885ad6b9cff39b9ce642e971944b4c3e4863c86",
  "python-kasi-api @ git+https://github.com/digitie/python-kasi-api@4259e574468435355be79d3fe85b394249ab1989",
  "python-krairport-api @ git+https://github.com/digitie/python-krairport-api@63d4db0b9c0145260b27d82023d8771f9293cb5a",
  "python-kric-api @ git+https://github.com/digitie/python-kric-api@55361313ad59f13e8699ebcbe130c532002b9b76",
  "python-krex-api @ git+https://github.com/digitie/python-krex-api@1a37a0108fa837351aa6bb6644052f325ae76daf",
  "python-opinet-api[browser] @ git+https://github.com/digitie/python-opinet-api@5fa00463e8cd0c67aa935e8e2f0c3adef48c42e2",
  "python-vworld-api @ git+https://github.com/digitie/python-vworld-api@3b174abea1a1e734c60a9c2522b2844474a1ec71",
  "python-multipart>=0.0.32,<1.0",
  "pydantic-settings>=2.15,<3.0",
  "psycopg2-binary>=2.9,<3.0",
  "sqlalchemy>=2.0.52,<3.0",
  "uvicorn[standard]>=0.52,<1.0",
]

[project.optional-dependencies]
dev = [
  "anyio>=4.14,<5.0",
  "pytest>=9.1,<10.0",
  "pytest-asyncio>=1.4,<2.0",
  "pytest-cov>=7.1,<8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
