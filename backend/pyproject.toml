[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kor-travel-transport-backend"
version = "0.1.0"
description = "Integrated domestic travel transport data API for parking-radar"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.22,<1.0",
  "alembic>=1.19,<2.0",
  "asyncpg>=0.31,<1.0",
  "dagster>=1.9,<2",
  "dagster-postgres>=0.25,<2",
  "fastapi>=0.141,<1.0",
  "httpx>=0.28,<1.0",
  "python-kasi-api @ git+https://github.com/digitie/python-kasi-api@51c39c1b0dd5b169b748552e81b9b9a55e86b9a1",
  "python-krairport-api @ git+https://github.com/digitie/python-krairport-api@cbe4d1380dc0388c078e8ae4622d3e580717064b",
  "python-kric-api @ git+https://github.com/digitie/python-kric-api@cd01fbc660444bc04cfa7a24e93e7989d7ee013e",
  "python-krex-api @ git+https://github.com/digitie/python-krex-api@adda2879f8bc1f0896867d28eee5583594ecda01",
  "python-opinet-api[browser] @ git+https://github.com/digitie/python-opinet-api@39e7acc3f863e66958964b8f137bba221bc7de08",
  "python-multipart>=0.0.32,<1.0",
  "pydantic-settings>=2.15,<3.0",
  "sqlalchemy>=2.0.52,<3.0",
  "uvicorn[standard]>=0.52,<1.0",
]

[project.optional-dependencies]
dev = [
  "anyio>=4.14,<5.0",
  "pytest>=9.1,<10.0",
  "pytest-asyncio>=1.4,<2.0",
  "pytest-cov>=7.1,<8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
