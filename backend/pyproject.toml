[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kor-travel-transport-backend"
version = "0.1.0"
description = "Integrated domestic travel transport data API"
requires-python = ">=3.12"
dependencies = [
  "kor-travel-common[dagster,reverse-address] @ git+https://github.com/digitie/kor-travel-common.git@67efe2e546ecef41e54a866bf4862d608ace343d#subdirectory=packages/py/kor-travel-common",
  "aiosqlite>=0.22,<1.0",
  "alembic==1.20.1",
  "asyncpg==0.32.0",
  "brotli>=1.1,<2.0",
  # Dagster 계열은 공용 Dagster 제어 평면의 호스트(Manager `docker/dagster-host`, 1.13.24)와 **같은 버전**으로 고정한다.
  # 공용 webserver는 code-server의 dagster가 호스트보다 높으면 unhealthy가 되고(전 테넌트), 배포·전환 스크립트는
  # 다르면 멈춘다. 호스트를 올릴 때 함께 올린다(uv.lock도).
  "dagster==1.13.24",
  "dagster-postgres==0.29.24",
  "dagster-webserver==1.13.24",
  "fastapi==0.165.0",
  "httpx==0.28.1",
  "mcp==2.3.0",
  "python-datagokr-api @ git+https://github.com/digitie/python-datagokr-api@18864a3aa3314bcd4cbefb6fabcd589c5847f750",
  "python-kasi-api @ git+https://github.com/digitie/python-kasi-api@4259e574468435355be79d3fe85b394249ab1989",
  "python-krairport-api @ git+https://github.com/digitie/python-krairport-api@b146b6ac85169c069bbe0119e3892a6006f7abcb",
  "python-krits-api @ git+https://github.com/digitie/python-krits-api@417e3d5dc1a897f770e9c832eb39d8ff9c40e92a",
  "python-kric-api @ git+https://github.com/digitie/python-kric-api@c006c8be64edfa4dc73cc3dd087c92cdeb9fba84",
  "python-krex-api @ git+https://github.com/digitie/python-krex-api@894ea64faed3a9a0ba9ba11b2a59dc5a0b5e5634",
  "python-opinet-api[browser] @ git+https://github.com/digitie/python-opinet-api@f7b7c3f994ac6e44e6af5f10d66d2e8fc4883d95",
  "python-vworld-api @ git+https://github.com/digitie/python-vworld-api@3b174abea1a1e734c60a9c2522b2844474a1ec71",
  "python-vadahub-api @ git+https://github.com/digitie/python-vadahub-api@169f339ff32f8138977962ab0cbb52cdb1bec7e5",
  "python-multipart>=0.0.32,<1.0",
  "pydantic==2.14.4",
  "pydantic-core==2.50.5",
  "pydantic-settings==2.16.3",
  "psycopg2-binary>=2.9,<3.0",
  "sqlalchemy==2.1.9",
  "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
dev = [
  "anyio>=4.14,<5.0",
  "pytest>=9.1,<10.0",
  "pytest-asyncio>=1.4,<2.0",
  "pytest-cov>=7.1,<8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
