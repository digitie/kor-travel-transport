[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kor-travel-transport-backend"
version = "0.1.0"
description = "Integrated domestic travel transport data API"
requires-python = ">=3.12"
dependencies = [
  "kor-travel-common[dagster,reverse-address] @ git+https://github.com/digitie/kor-travel-common.git@e746e4b81b9b62dd1a74ca90ba0a1204951c2885#subdirectory=packages/py/kor-travel-common",
  "aiosqlite>=0.22,<1.0",
  "alembic>=1.19,<2.0",
  "asyncpg>=0.31,<1.0",
  "brotli>=1.1,<2.0",
  # Dagster 계열은 공용 Dagster 제어 평면의 호스트(Manager `docker/dagster-host`, 1.13.24)와 **같은 버전**으로 고정한다.
  # 공용 webserver는 code-server의 dagster가 호스트보다 높으면 unhealthy가 되고(전 테넌트), 배포·전환 스크립트는
  # 다르면 멈춘다. 호스트를 올릴 때 함께 올린다(uv.lock도).
  "dagster==1.13.24",
  "dagster-postgres==0.29.24",
  "dagster-webserver==1.13.24",
  "fastapi>=0.141,<1.0",
  "httpx>=0.28,<1.0",
  "python-datagokr-api @ git+https://github.com/digitie/python-datagokr-api@69c8107ad629d52137673696622475f6c7215a70",
  "python-kasi-api @ git+https://github.com/digitie/python-kasi-api@4259e574468435355be79d3fe85b394249ab1989",
  "python-krairport-api @ git+https://github.com/digitie/python-krairport-api@0a7648450c62027fb95146a2442c3f925c80d6aa",
  "python-krits-api @ git+https://github.com/digitie/python-krits-api@417e3d5dc1a897f770e9c832eb39d8ff9c40e92a",
  "python-kric-api @ git+https://github.com/digitie/python-kric-api@5bf0e61604443fa0e0bd4b1255720fca2bcc993f",
  "python-krex-api @ git+https://github.com/digitie/python-krex-api@1a37a0108fa837351aa6bb6644052f325ae76daf",
  "python-opinet-api[browser] @ git+https://github.com/digitie/python-opinet-api@f58a879676f8d2c6d8de26e3daaf7eb154fd9ad2",
  "python-vworld-api @ git+https://github.com/digitie/python-vworld-api@3b174abea1a1e734c60a9c2522b2844474a1ec71",
  "python-vadahub-api @ git+https://github.com/digitie/python-vadahub-api@4bc0164e48799bba5488f91ea1a06b5e2e86de78",
  "python-multipart>=0.0.32,<1.0",
  "pydantic-settings>=2.15,<3.0",
  "psycopg2-binary>=2.9,<3.0",
  "sqlalchemy>=2.0.52,<3.0",
  "uvicorn[standard]>=0.52,<1.0",
]

[project.optional-dependencies]
dev = [
  "anyio>=4.14,<5.0",
  "pytest>=9.1,<10.0",
  "pytest-asyncio>=1.4,<2.0",
  "pytest-cov>=7.1,<8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
