name: kor-travel-airport

# PostgreSQL은 이 파일이 아니라 `docker-compose.db.yml`에서 별도 lifecycle로 관리한다
# (T-032). 이 스택을 올리기 전에 DB 스택을 먼저 올려 `kor-travel-airport-net`과 `postgres`
# 서비스가 존재해야 한다:
#   docker compose -f docker-compose.db.yml up -d
# backend는 `depends_on`으로 DB 준비를 강제하지 않는다(별도 compose 파일 간에는
# `depends_on`이 동작하지 않는다) — 대신 `restart: unless-stopped`와
# entrypoint의 `alembic upgrade head` 실패 시 재시작에 의존한다.

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: "${DATABASE_URL:-postgresql+asyncpg://parking_radar:parking_radar@postgres:5432/parking_radar}"
      RELEASE_SHA: "${RELEASE_SHA:-unknown}"
      RUN_DB_MIGRATIONS: "${RUN_DB_MIGRATIONS:-true}"
      ENABLE_SCHEDULER: "${ENABLE_SCHEDULER:-false}"
      ENABLE_MANUAL_COLLECT: "${ENABLE_MANUAL_COLLECT:-false}"
      SCHEDULER_SAFETY_BUFFER_SECONDS: "${SCHEDULER_SAFETY_BUFFER_SECONDS:-120}"
      SEED_SAMPLE_DATA: "${SEED_SAMPLE_DATA:-true}"
      USE_SAMPLE_CLIENT_WHEN_NO_KEY: "${USE_SAMPLE_CLIENT_WHEN_NO_KEY:-true}"
      ENABLE_INCHEON_COLLECTION: "${ENABLE_INCHEON_COLLECTION:-true}"
      ENABLE_INCHEON_FEE_COLLECTION: "${ENABLE_INCHEON_FEE_COLLECTION:-false}"
      ENABLE_FEE_COLLECTION: "${ENABLE_FEE_COLLECTION:-false}"
      COLLECT_INTERVAL_SECONDS: "${COLLECT_INTERVAL_SECONDS:-300}"
      MANUAL_COLLECT_MIN_INTERVAL_SECONDS: "${MANUAL_COLLECT_MIN_INTERVAL_SECONDS:-300}"
      UPSTREAM_RATE_LIMIT_BACKOFF_SECONDS: "${UPSTREAM_RATE_LIMIT_BACKOFF_SECONDS:-3600}"
      API_TIMEOUT_SECONDS: "${API_TIMEOUT_SECONDS:-15}"
      HOLIDAY_CACHE_SECONDS: "${HOLIDAY_CACHE_SECONDS:-86400}"
      FLIGHT_STATUS_CACHE_SECONDS: "${FLIGHT_STATUS_CACHE_SECONDS:-300}"
      AIRPORT_CODES_CSV: "${AIRPORT_CODES_CSV:-GMP,PUS,CJU,ICN}"
      CORS_ORIGINS_CSV: "${CORS_ORIGINS_CSV:-http://localhost:3000}"
      TRUSTED_HOSTS_CSV: "${TRUSTED_HOSTS_CSV:-localhost,127.0.0.1,testserver,backend}"
      ENABLE_API_DOCS: "${ENABLE_API_DOCS:-true}"
      APP_TIMEZONE: "${APP_TIMEZONE:-Asia/Seoul}"
      DATA_GO_KR_SERVICE_KEY: "${DATA_GO_KR_SERVICE_KEY:-}"
      KEX_EX_API_KEY: "${KEX_EX_API_KEY:-}"
      TRANSPORT_COLLECTION_ENABLED: "${TRANSPORT_COLLECTION_ENABLED:-false}"
      TRANSPORT_COLLECT_INTERVAL_SECONDS: "${TRANSPORT_COLLECT_INTERVAL_SECONDS:-300}"
      TRANSPORT_QUOTA_BACKOFF_SECONDS: "${TRANSPORT_QUOTA_BACKOFF_SECONDS:-3600}"
      TRANSPORT_ROUTE_NOS_CSV: "${TRANSPORT_ROUTE_NOS_CSV:-}"
      TRANSPORT_CONZONE_IDS_CSV: "${TRANSPORT_CONZONE_IDS_CSV:-}"
      OPINET_BROWSER_ENABLED: "${OPINET_BROWSER_ENABLED:-true}"
      OPINET_QUERY_LEVEL: "${OPINET_QUERY_LEVEL:-sigungu}"
      OPINET_BROWSER_CHANNEL: "${OPINET_BROWSER_CHANNEL:-}"
      OPINET_BROWSER_TIMEOUT_MS: "${OPINET_BROWSER_TIMEOUT_MS:-30000}"
      PORT_GUIDELINE_COLLECTION_ENABLED: "${PORT_GUIDELINE_COLLECTION_ENABLED:-true}"
      FERRY_TIMETABLE_CACHE_SECONDS: "${FERRY_TIMETABLE_CACHE_SECONDS:-300}"
      FERRY_TIMETABLE_CACHE_MAX_ENTRIES: "${FERRY_TIMETABLE_CACHE_MAX_ENTRIES:-500}"
      FERRY_TIMETABLE_MAX_DAYS_AHEAD: "${FERRY_TIMETABLE_MAX_DAYS_AHEAD:-7}"
      BUS_TIMETABLE_CACHE_SECONDS: "${BUS_TIMETABLE_CACHE_SECONDS:-300}"
      BUS_TIMETABLE_CACHE_MAX_ENTRIES: "${BUS_TIMETABLE_CACHE_MAX_ENTRIES:-500}"
      BUS_TIMETABLE_MIN_INTERVAL_SECONDS: "${BUS_TIMETABLE_MIN_INTERVAL_SECONDS:-900}"
      TRANSPORT_STATISTICS_CACHE_SECONDS: "${TRANSPORT_STATISTICS_CACHE_SECONDS:-60}"
      TRANSPORT_STATISTICS_MAX_CONCURRENT_MISSES: "${TRANSPORT_STATISTICS_MAX_CONCURRENT_MISSES:-2}"
      BACKUP_DIR: "${BACKUP_DIR:-/app/backups}"
      BACKUP_RETENTION_COUNT: "${BACKUP_RETENTION_COUNT:-14}"
      BACKUP_COMMAND_TIMEOUT_SECONDS: "${BACKUP_COMMAND_TIMEOUT_SECONDS:-120}"
      BACKUP_UPLOAD_TIMEOUT_SECONDS: "${BACKUP_UPLOAD_TIMEOUT_SECONDS:-600}"
      BACKUP_STORAGE_LIMIT_BYTES: "${BACKUP_STORAGE_LIMIT_BYTES:-8589934592}"
    volumes:
      - ./backups:/app/backups
    networks:
      - kor-travel-airport-net
    ports:
      - "${PUBLIC_API_PORT:-14001}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: "${NEXT_PUBLIC_API_BASE_URL:-}"
        NEXT_PUBLIC_API_PORT: "${NEXT_PUBLIC_API_PORT:-8000}"
    restart: unless-stopped
    environment:
      BACKEND_INTERNAL_URL: "${BACKEND_INTERNAL_URL:-http://backend:8000}"
      BACKEND_PROXY_TIMEOUT_MS: "${BACKEND_PROXY_TIMEOUT_MS:-10000}"
      BACKEND_PROXY_BODY_TIMEOUT_MS: "${BACKEND_PROXY_BODY_TIMEOUT_MS:-10000}"
      BACKUP_PROXY_TIMEOUT_MS: "${BACKUP_PROXY_TIMEOUT_MS:-900000}"
      BACKUP_PROXY_BODY_TIMEOUT_MS: "${BACKUP_PROXY_BODY_TIMEOUT_MS:-900000}"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - kor-travel-airport-net
    ports:
      - "${PUBLIC_WEB_PORT:-14002}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then((r) => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

networks:
  kor-travel-airport-net:
    external: true
