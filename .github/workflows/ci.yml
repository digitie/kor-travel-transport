name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://parking_radar:parking_radar@localhost:5432/parking_radar
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: parking_radar
          POSTGRES_USER: parking_radar
          POSTGRES_PASSWORD: parking_radar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U parking_radar -d parking_radar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev --locked
      - run: uv run alembic -c alembic.ini upgrade head
      - run: uv run alembic -c alembic.ini check
      - run: uv run pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test -- --run
      - run: npx tsc -p tsconfig.test.json --noEmit
      - run: npm run build

  transport-admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/kor-travel-transport-admin/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/kor-travel-transport-admin/frontend/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run type-check
      - run: npm run build

  live-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      E2E_BASE_URL: https://pr.digitie.mywire.org
      EXPECTED_RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run e2e:install
      - run: npm run test:e2e
