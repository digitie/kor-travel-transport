name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      e2e_base_url:
        description: "배포가 끝난 뒤 검증할 운영 URL"
        required: true
        type: string
      expected_release_sha:
        description: "운영 health endpoint가 반환해야 하는 배포 commit SHA"
        required: true
        type: string

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      # Alembic은 Settings의 DATABASE_URL을 읽고, pytest fixture는 TEST_DATABASE_URL만 opt-in으로 쓴다.
      DATABASE_URL: postgresql+asyncpg://parking_radar:parking_radar@localhost:5432/parking_radar
      TEST_DATABASE_URL: postgresql+asyncpg://parking_radar:parking_radar@localhost:5432/parking_radar
      PARKING_RADAR_TEST_DATABASE: "1"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: parking_radar
          POSTGRES_USER: parking_radar
          POSTGRES_PASSWORD: parking_radar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U parking_radar -d parking_radar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev --locked
      - run: uv run alembic -c alembic.ini upgrade head
      - run: uv run alembic -c alembic.ini check
      - run: uv run pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test -- --run
      - run: npx tsc -p tsconfig.test.json --noEmit
      - run: npm run build

  transport-admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/kor-travel-transport-admin/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/kor-travel-transport-admin/frontend/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run type-check
      - run: npm run build

  live-e2e:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      E2E_BASE_URL: ${{ inputs.e2e_base_url }}
      EXPECTED_RELEASE_SHA: ${{ inputs.expected_release_sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run e2e:install
      - run: npm run test:e2e
