name: Transport admin live E2E

on:
  workflow_dispatch:
    inputs:
      web_url:
        description: "배포한 transport admin URL"
        required: true
        default: "https://transport.digitie.mywire.org"
        type: string
      api_url:
        description: "배포한 transport API URL"
        required: true
        default: "https://transport-api.digitie.mywire.org"
        type: string
      dagster_url:
        description: "공용 Dagster gateway URL(transport는 공용 plane의 location kor-travel-transport)"
        required: true
        default: "https://dagster.digitie.mywire.org"
        type: string
      release_sha:
        description: "배포 스크립트가 기록한 candidate Git SHA"
        required: true
        type: string

jobs:
  live-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/kor-travel-transport-admin/frontend
    env:
      E2E_BASE_URL: ${{ inputs.web_url }}
      E2E_TRANSPORT_API_BASE_URL: ${{ inputs.api_url }}
      E2E_TRANSPORT_DAGSTER_BASE_URL: ${{ inputs.dagster_url }}
      E2E_TRANSPORT_RELEASE_SHA: ${{ inputs.release_sha }}
      # 운영 로그인 비밀번호는 저장소에 두지 않는다. 운영 .env.prod의 TRANSPORT_UI_PASSWORD와 같은 값을
      # Actions secret TRANSPORT_ADMIN_E2E_PASSWORD로 넣는다(운영값을 바꾸면 secret도 함께 바꾼다).
      E2E_TRANSPORT_UI_PASSWORD: ${{ secrets.TRANSPORT_ADMIN_E2E_PASSWORD }}
    steps:
      - name: Require admin E2E password secret
        working-directory: .
        run: |
          if [ -z "${E2E_TRANSPORT_UI_PASSWORD}" ]; then
            echo "::error::Actions secret TRANSPORT_ADMIN_E2E_PASSWORD가 비어 있습니다. 운영 TRANSPORT_UI_PASSWORD 값을 secret으로 등록하세요." >&2
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: packages/kor-travel-transport-admin/frontend/package-lock.json
      - run: npx --yes npm@12.0.1 ci
      - run: npm run e2e:install
      - run: npm run test:e2e
