name: kor-travel-transport-fuel

# 기존 Transport CURRENT/core/admin과 별개인 공개 fuel 쌍이다.
# DB/Python/Dagster/수집·migration 역할과 운영 비밀 env_file은 추가하지 않는다.
services:
  fuel-api-gateway:
    image: "${TRANSPORT_FUEL_GATEWAY_IMAGE:?set the verified fuel gateway image}"
    build:
      context: .
      dockerfile: deploy/transport-fuel/Dockerfile.gateway
      args:
        RELEASE_SHA: "${TRANSPORT_FUEL_RELEASE_SHA:?set the canonical source revision}"
    restart: unless-stopped
    network_mode: host
    mem_limit: 64m
    memswap_limit: 64m
    environment:
      TRANSPORT_FUEL_API_PORT: "${TRANSPORT_FUEL_API_PORT:-12307}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${TRANSPORT_FUEL_API_PORT:-12307}/health >/dev/null"]
      interval: 45s
      timeout: 5s
      retries: 5

  fuel-web:
    image: "${TRANSPORT_FUEL_WEB_IMAGE:?set the verified fuel public UI image}"
    build:
      context: .
      dockerfile: packages/kor-travel-transport-admin/frontend/Dockerfile
      args:
        TRANSPORT_ADMIN_RELEASE_SHA: "${TRANSPORT_FUEL_RELEASE_SHA:?set the canonical source revision}"
        NEXT_PUBLIC_TRANSPORT_DAGSTER_URL: "${NEXT_PUBLIC_TRANSPORT_DAGSTER_URL:-https://dagster.digitie.mywire.org}"
        NEXT_PUBLIC_VWORLD_API_KEY: "${NEXT_PUBLIC_VWORLD_API_KEY:?set the VWorld browser key}"
    restart: unless-stopped
    network_mode: host
    mem_limit: 512m
    memswap_limit: 512m
    environment:
      TRANSPORT_UI_MODE: fuel
      BACKEND_INTERNAL_URL: "http://127.0.0.1:${TRANSPORT_FUEL_API_PORT:-12307}"
      TRANSPORT_UI_PUBLIC_ORIGIN: "https://fuel.digitie.mywire.org"
      TRANSPORT_FUEL_WEB_PORT: "${TRANSPORT_FUEL_WEB_PORT:-12308}"
    command: ["sh", "-c", "npm run start -- --hostname 0.0.0.0 --port ${TRANSPORT_FUEL_WEB_PORT:-12308}"]
    depends_on:
      fuel-api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "const started=process.hrtime.bigint(),http=require('node:http');let request,response,timer,done=false,size=0;const remaining=()=>4000-Number(process.hrtime.bigint()-started)/1e6;const finish=code=>{if(done)return;done=true;if(code===0&&remaining()<=0)code=1;clearTimeout(timer);response?.destroy();request?.destroy();process.exitCode=code;};timer=setTimeout(()=>finish(1),Math.max(0,remaining()));try{request=http.get('http://127.0.0.1:${TRANSPORT_FUEL_WEB_PORT:-12308}/',{agent:false,headers:{Connection:'close'}},r=>{response=r;r.on('error',()=>finish(1));r.on('aborted',()=>finish(1));r.on('close',()=>{if(!r.complete)finish(1);});if(!Number.isInteger(r.statusCode)||r.statusCode<200||r.statusCode>=300){finish(1);return;}const length=r.headers['content-length'];if(length!==undefined&&(!length.length||Number(length)>1048576||!Array.from(length).every(c=>c>='0'&&c<='9'))){finish(1);return;}r.on('data',chunk=>{size+=chunk.length;if(size>1048576)finish(1);});r.on('end',()=>finish(r.complete&&!r.aborted?0:1));});request.on('error',()=>finish(1));}catch{finish(1);}"]
      interval: 45s
      timeout: 5s
      retries: 5
      start_period: 20s
