# kor-travel-docker-manager가 운영하는 n150 host-network 공용 PostgreSQL/RustFS를
# 소비하는 운영 overlay. 운영 런타임도 Weather 정본과 동일하게 host-network를 쓰며,
# 공용 DB는 컨테이너별 bridge gateway가 아니라 `127.0.0.1:11000`으로 접근한다.
# 로컬의 기존 `docker-compose.yml` + `docker-compose.db.yml` 흐름은 빠른 개발·legacy
# data rollback 전용으로 남긴다. 운영에서는 이 파일을 base compose와 함께 사용한다.

#
# Dagster는 공용 제어 평면(kor-travel-docker-manager ADR-54)에 합류했다. 공용 daemon·webserver
# (`127.0.0.1:11002`)·gateway(`dagster.digitie.mywire.org`)가 이 프로젝트의 code-server를 workspace
# location `kor-travel-transport`로 싣는다. 이 파일에 남는 Dagster 프로세스는 code-server 하나다.
# 옛 webserver·daemon·gateway와 옛 metadata DB의 migrate는 `profiles: [legacy-dagster]`에 남는다 — Manager 전환
# 스크립트의 모양 파생(펜스할 옛 서비스)이 찾는다. 평소 `up`은 그것들을 띄우지 않는다. 되돌리기는 지원하지 않는다
# (보장 없는 수동 best-effort). 자세히는 `docs/architecture/shared-db-dagster.md` §공용 Dagster 제어 평면.

# 옛 프로젝트 전용 Dagster instance(`kor_travel_transport_dagster`) — legacy-dagster 서비스만 쓴다.
x-dagster-control-environment: &dagster-control-environment
  DAGSTER_HOME: /app/dagster_home
  DAGSTER_POSTGRES_URL: "${DAGSTER_POSTGRES_URL:?set the dedicated Dagster metadata DSN}"
  # Application schema DDL belongs only to the migrate one-shot service.
  RUN_DB_MIGRATIONS: "false"

# 공용 Dagster instance. 값은 Manager compose의 `x-dagster-shared-control-env`와 같은 URL이다(role·DB 이름은
# literal — env override로 한쪽만 바꾸면 다른 DB를 겨냥한다). 비밀번호는 Manager `.env`의
# `KOR_TRAVEL_DAGSTER_SHARED_APP_PASSWORD`와 같은 값을 `.env.server14`에 둔다. `postgresql+psycopg2://`를
# 명시한다 — 이 이미지는 SQLAlchemy 2.1이라 맨 `postgresql://`이면 psycopg v3를 골라 dagster-postgres가 깨진다.
x-dagster-shared-environment: &dagster-shared-environment
  DAGSTER_HOME: /app/dagster_home
  KOR_TRAVEL_DAGSTER_SHARED_PG_URL: "postgresql+psycopg2://kor_travel_dagster_shared_app:${KOR_TRAVEL_DAGSTER_SHARED_APP_PASSWORD:?set KOR_TRAVEL_DAGSTER_SHARED_APP_PASSWORD (same value as the Manager .env)}@127.0.0.1:11000/dagster_shared"
  # Application schema DDL belongs only to the migrate one-shot service.
  RUN_DB_MIGRATIONS: "false"

# code-server와 그 run worker만 provider·application DB·RustFS secrets를 받는다.
# 공용 webserver/daemon은 이 값을 모른다 — gRPC workspace로만 이 code-server에 닿는다.
x-dagster-execution-environment: &dagster-execution-environment
  <<: *dagster-shared-environment
  DATABASE_URL: "${DATABASE_URL:?set the application database DSN}"
  SCHEDULER_MODE: dagster
  ENABLE_SCHEDULER: "true"
  SEED_SAMPLE_DATA: "false"
  USE_SAMPLE_CLIENT_WHEN_NO_KEY: "false"
  APP_TIMEZONE: "${APP_TIMEZONE:-Asia/Seoul}"
  API_TIMEOUT_SECONDS: "${API_TIMEOUT_SECONDS:-15}"
  UPSTREAM_RATE_LIMIT_BACKOFF_SECONDS: "${UPSTREAM_RATE_LIMIT_BACKOFF_SECONDS:-3600}"
  ENABLE_INCHEON_COLLECTION: "${ENABLE_INCHEON_COLLECTION:-true}"
  ENABLE_INCHEON_FEE_COLLECTION: "${ENABLE_INCHEON_FEE_COLLECTION:-false}"
  ENABLE_FEE_COLLECTION: "${ENABLE_FEE_COLLECTION:-false}"
  AIRPORT_CODES_CSV: "${AIRPORT_CODES_CSV:-CJJ,CJU,GMP,HIN,ICN,KUV,KWJ,MWX,PUS,RSU,TAE,USN,WJU}"
  DATA_GO_KR_SERVICE_KEY: "${DATA_GO_KR_SERVICE_KEY:-}"
  VWORLD_API_KEY: "${VWORLD_API_KEY:-}"
  PLACE_LOCATION_COLLECTION_ENABLED: "${PLACE_LOCATION_COLLECTION_ENABLED:-false}"
  PLACE_LOCATION_MAX_CALLS_PER_DAY: "${PLACE_LOCATION_MAX_CALLS_PER_DAY:-10000}"
  PLACE_LOCATION_REQUEST_INTERVAL_SECONDS: "${PLACE_LOCATION_REQUEST_INTERVAL_SECONDS:-0.01}"
  KAKAO_REST_API_KEY: "${KAKAO_REST_API_KEY:-}"
  KAKAO_PLACE_COLLECTION_ENABLED: "${KAKAO_PLACE_COLLECTION_ENABLED:-false}"
  KAKAO_PLACE_MAX_CALLS_PER_DAY: "${KAKAO_PLACE_MAX_CALLS_PER_DAY:-5000}"
  KAKAO_PLACE_MAX_CALLS_PER_MONTH: "${KAKAO_PLACE_MAX_CALLS_PER_MONTH:-50000}"
  KAKAO_PLACE_REQUEST_INTERVAL_SECONDS: "${KAKAO_PLACE_REQUEST_INTERVAL_SECONDS:-0.2}"
  KEX_EX_API_KEY: "${KEX_EX_API_KEY:-}"
  REST_AREA_COLLECTION_ENABLED: "${REST_AREA_COLLECTION_ENABLED:-false}"
  TRANSPORT_COLLECTION_ENABLED: "${TRANSPORT_COLLECTION_ENABLED:-false}"
  TRANSPORT_COLLECT_INTERVAL_SECONDS: "${TRANSPORT_COLLECT_INTERVAL_SECONDS:-300}"
  TRANSPORT_QUOTA_BACKOFF_SECONDS: "${TRANSPORT_QUOTA_BACKOFF_SECONDS:-3600}"
  TRANSPORT_ROUTE_NOS_CSV: "${TRANSPORT_ROUTE_NOS_CSV:-}"
  TRANSPORT_CONZONE_IDS_CSV: "${TRANSPORT_CONZONE_IDS_CSV:-}"
  OPINET_BROWSER_ENABLED: "${OPINET_BROWSER_ENABLED:-true}"
  OPINET_QUERY_LEVEL: "${OPINET_QUERY_LEVEL:-sigungu}"
  OPINET_BROWSER_CHANNEL: "${OPINET_BROWSER_CHANNEL:-}"
  OPINET_BROWSER_TIMEOUT_MS: "${OPINET_BROWSER_TIMEOUT_MS:-60000}"
  RAIL_REFERENCE_COLLECTION_ENABLED: "${RAIL_REFERENCE_COLLECTION_ENABLED:-false}"
  KRIC_SERVICE_KEY: "${KRIC_SERVICE_KEY:-}"
  KRIC_TIMETABLE_COLLECTION_ENABLED: "${KRIC_TIMETABLE_COLLECTION_ENABLED:-false}"
  KRIC_TIMETABLE_MAX_CALLS: "${KRIC_TIMETABLE_MAX_CALLS:-500}"
  KRIC_TIMETABLE_REQUEST_INTERVAL_SECONDS: "${KRIC_TIMETABLE_REQUEST_INTERVAL_SECONDS:-5}"
  MARITIME_REFERENCE_COLLECTION_ENABLED: "${MARITIME_REFERENCE_COLLECTION_ENABLED:-false}"
  BUS_REFERENCE_COLLECTION_ENABLED: "${BUS_REFERENCE_COLLECTION_ENABLED:-false}"
  PORT_GUIDELINE_COLLECTION_ENABLED: "${PORT_GUIDELINE_COLLECTION_ENABLED:-true}"
  FERRY_TIMETABLE_COLLECTION_ENABLED: "${FERRY_TIMETABLE_COLLECTION_ENABLED:-false}"
  FERRY_TIMETABLE_STORAGE_DAYS: "${FERRY_TIMETABLE_STORAGE_DAYS:-10}"
  FERRY_TIMETABLE_COLLECTION_MAX_PROVIDER_CALLS: "${FERRY_TIMETABLE_COLLECTION_MAX_PROVIDER_CALLS:-280}"
  FERRY_TIMETABLE_COLLECTION_INTERVAL_SECONDS: "${FERRY_TIMETABLE_COLLECTION_INTERVAL_SECONDS:-2}"
  FERRY_TIMETABLE_CACHE_SECONDS: "${FERRY_TIMETABLE_CACHE_SECONDS:-300}"
  FERRY_TIMETABLE_CACHE_MAX_ENTRIES: "${FERRY_TIMETABLE_CACHE_MAX_ENTRIES:-500}"
  FERRY_TIMETABLE_MIN_INTERVAL_SECONDS: "${FERRY_TIMETABLE_MIN_INTERVAL_SECONDS:-30}"
  FERRY_TIMETABLE_MAX_DAYS_AHEAD: "${FERRY_TIMETABLE_MAX_DAYS_AHEAD:-9}"
  BUS_TIMETABLE_CACHE_SECONDS: "${BUS_TIMETABLE_CACHE_SECONDS:-900}"
  BUS_TIMETABLE_CACHE_MAX_ENTRIES: "${BUS_TIMETABLE_CACHE_MAX_ENTRIES:-500}"
  BUS_TIMETABLE_MIN_INTERVAL_SECONDS: "${BUS_TIMETABLE_MIN_INTERVAL_SECONDS:-900}"
  TRANSPORT_STATISTICS_CACHE_SECONDS: "${TRANSPORT_STATISTICS_CACHE_SECONDS:-60}"
  TRANSPORT_STATISTICS_MAX_CONCURRENT_MISSES: "${TRANSPORT_STATISTICS_MAX_CONCURRENT_MISSES:-2}"
  TRANSPORT_STATISTICS_TIMEOUT_SECONDS: "${TRANSPORT_STATISTICS_TIMEOUT_SECONDS:-20}"
  RUSTFS_ENDPOINT_URL: "${RUSTFS_ENDPOINT_URL:-}"
  RUSTFS_BUCKET: "${RUSTFS_BUCKET:-kor-travel-transport-raw}"
  RUSTFS_ACCESS_KEY_ID: "${RUSTFS_ACCESS_KEY_ID:-}"
  RUSTFS_SECRET_ACCESS_KEY: "${RUSTFS_SECRET_ACCESS_KEY:-}"
  RUSTFS_REGION_NAME: "${RUSTFS_REGION_NAME:-us-east-1}"
  RUSTFS_RAW_PREFIX: "${RUSTFS_RAW_PREFIX:-provider-raw}"
  RUSTFS_ALLOW_INSECURE_HTTP: "${RUSTFS_ALLOW_INSECURE_HTTP:-false}"


# 공용 plane code-server의 healthcheck — kor-travel-docker-manager `docker-compose.yml`의 `x-dagster-code-server-probe`
# **원문 그대로**다(Manager #456). proxy(`code-server start`)가 아니라 자식에 전달되는 `ListRepositories`를 보고, 죽은·멈춘
# 자식은 run worker가 없을 때 PID 1(init)을 끝내 `restart`가 다시 띄우게 하며, 컨테이너가 새로 뜨면 그 전에 시작한 이
# location의 STARTED run(worker가 함께 사라진 run)을 실패로 닫는다. 판정 규칙·근거는 Manager 쪽 주석이 정본이다.
# **고치지 않는다** — Manager 전환 스크립트가 이 원문이 Manager의 것과 같은지 대조하고 다르면 전환을 멈춘다. Manager가
# probe를 바꾸면 이 블록을 그 원문으로 다시 복사한다.
x-dagster-code-server-probe: &dagster-code-server-probe |-
  import os, sys, time, subprocess
  mark, tried, fails, passed = '/tmp/.ktdm-orphan-reap', '/tmp/.ktdm-orphan-reap.tried', '/tmp/.ktdm-probe-fails', '/tmp/.ktdm-probe-passed'
  born = open('/proc/1/stat').read().rsplit(')', 1)[1].split()[19]
  key = open('/proc/sys/kernel/random/boot_id').read().strip() + ':' + born
  def write(path, text):
      new = '%s.%d.%s' % (path, os.getpid(), os.urandom(4).hex())
      with open(new, 'w') as f:
          f.write(text)
      os.replace(new, path)
  if sys.argv[2:] == ['reap']:
      import fcntl
      lock = open(mark + '.lock', 'w')
      try:
          fcntl.flock(lock, fcntl.LOCK_EX | fcntl.LOCK_NB)
      except OSError:
          sys.exit(0)
      argv = open('/proc/1/cmdline').read().split('\0')
      def flag(*names):
          for i, w in enumerate(argv):
              for name in names:
                  if w == name and i + 1 < len(argv):
                      return argv[i + 1]
                  if w.startswith(name + '='):
                      return w[len(name) + 1:]
      location = flag('--location-name', '-l') or flag('-m', '--module-name')
      if not location:
          print('orphan reaper: PID 1 argv names no code location; nothing to reap', flush=True)
      else:
          from dagster import DagsterInstance
          from dagster._core.storage.dagster_run import DagsterRunStatus, RunsFilter
          since = time.time() - float(open('/proc/uptime').read().split()[0]) + int(born) / os.sysconf('SC_CLK_TCK')
          instance = DagsterInstance.get()
          for record in instance.get_run_records(filters=RunsFilter(statuses=[DagsterRunStatus.STARTED], tags={'dagster/code_location': location})):
              if record.start_time is not None and record.start_time < since:
                  instance.report_run_failed(record.dagster_run, 'run worker lost: this code server container restarted after the run started')
                  print('orphan run failed:', record.dagster_run.run_id, flush=True)
      write(mark, key)
      sys.exit(0)
  import grpc
  from grpc_health.v1 import health_pb2 as h, health_pb2_grpc as g
  now = time.monotonic()
  seen_healthy = os.path.exists(passed) and open(passed).read() == key
  c = grpc.insecure_channel('127.0.0.1:' + sys.argv[1])
  def kind_of(e):
      return 'timeout' if e.code() == grpc.StatusCode.DEADLINE_EXCEEDED else str(e.code())
  try:
      r = g.HealthStub(c).Check(h.HealthCheckRequest(service='DagsterApi'), timeout=4)
      kind = None if r.status == h.HealthCheckResponse.SERVING else 'NOT_SERVING'
  except grpc.RpcError as e:
      kind = kind_of(e)
  if kind and not seen_healthy:
      sys.exit(1)
  if not kind:
      try:
          kind = 'load error' if b'SerializableErrorInfo' in c.unary_unary('/api.DagsterApi/ListRepositories')(b'', timeout=4) else None
      except grpc.RpcError as e:
          kind = kind_of(e)
  if kind:
      try:
          k, count, first, down, clock = open(fails).read().split()
          if k != key or clock != 'monotonic':
              raise ValueError(k)
          count, first = int(count) + 1, float(first)
      except (OSError, ValueError):
          count, first, down = 1, now, '-'
      down = '-' if kind == 'load error' else (down if down != '-' else str(now))
      write(fails, ' '.join((key, str(count), str(first), down, 'monotonic')))
      print('child', kind, 'x' + str(count), file=sys.stderr)
      def runs_in_flight():
          for pid in os.listdir('/proc'):
              try:
                  if pid.isdigit() and any(arg.startswith(b'from multiprocessing.spawn import spawn_main') for arg in open('/proc/' + pid + '/cmdline', 'rb').read().split(b'\0')):
                      return True
              except OSError:
                  pass
          return False
      down_for = now - float(down) if down != '-' else 0.0
      if kind == 'load error':
          due = now - first >= 90
      elif kind == 'timeout':
          due = down_for >= (300 if seen_healthy else 1800)
      else:
          due = down_for >= 90
      if count >= 3 and due and (down_for >= 7200 or not runs_in_flight()):
          os.kill(1, 15)
      sys.exit(1)
  os.path.exists(fails) and os.remove(fails)
  seen_healthy or write(passed, key)
  if (not os.path.exists(mark) or open(mark).read() != key) and (not os.path.exists(tried) or time.time() - os.path.getmtime(tried) >= 300):
      open(tried, 'w').close()
      log = open('/proc/1/fd/2', 'w')
      subprocess.Popen([sys.executable, '-I', '-c', sys.orig_argv[sys.orig_argv.index('-c') + 1], sys.argv[1], 'reap'], start_new_session=True, stdin=subprocess.DEVNULL, stdout=log, stderr=log)


services:
  backend:
    image: "${BACKEND_RUNTIME_IMAGE:-kor-travel-transport-backend:latest}"
    network_mode: host
    networks: !reset []
    ports: !reset []
    extra_hosts: !reset []
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "${PUBLIC_API_PORT:-14001}"]
    environment:
      DATABASE_URL: "${DATABASE_URL:?set the application database DSN}"
      RUN_DB_MIGRATIONS: "false"
      SCHEDULER_MODE: dagster
      ENABLE_SCHEDULER: "true"
      # 공개 실시간 여객선·TAGO 버스 시간표 endpoint도 data.go.kr provider를 호출한다.
      DATA_GO_KR_SERVICE_KEY: "${DATA_GO_KR_SERVICE_KEY:-}"
      VWORLD_API_KEY: "${VWORLD_API_KEY:-}"
      PLACE_LOCATION_COLLECTION_ENABLED: "${PLACE_LOCATION_COLLECTION_ENABLED:-false}"
      KAKAO_REST_API_KEY: "${KAKAO_REST_API_KEY:-}"
      KAKAO_PLACE_COLLECTION_ENABLED: "${KAKAO_PLACE_COLLECTION_ENABLED:-false}"
      TRANSPORT_ADMIN_WRITE_TOKEN: "${TRANSPORT_ADMIN_WRITE_TOKEN:-}"
      # kor-travel-map이 읽는 내부 export 토큰(ADR-013). 비면 /v1/service/exports/*는 404다.
      TRANSPORT_SERVICE_EXPORT_TOKEN: "${TRANSPORT_SERVICE_EXPORT_TOKEN:-}"
      # export에 접속할 수 있는 peer 대역(CIDR). 운영은 Map이 host network라 loopback만 연다.
      SERVICE_EXPORT_ALLOWED_CLIENTS_CSV: "${SERVICE_EXPORT_ALLOWED_CLIENTS_CSV:-127.0.0.1/32,::1/128}"
      # 휴게소 수집 상태(/v1/transport/providers)가 Dagster 수집기와 같은 설정을 보도록 backend에도 준다.
      REST_AREA_COLLECTION_ENABLED: "${REST_AREA_COLLECTION_ENABLED:-false}"
      KEX_EX_API_KEY: "${KEX_EX_API_KEY:-}"
      RAIL_REFERENCE_COLLECTION_ENABLED: "${RAIL_REFERENCE_COLLECTION_ENABLED:-false}"
      KRIC_SERVICE_KEY: "${KRIC_SERVICE_KEY:-}"
      KRIC_TIMETABLE_COLLECTION_ENABLED: "${KRIC_TIMETABLE_COLLECTION_ENABLED:-false}"
      MARITIME_REFERENCE_COLLECTION_ENABLED: "${MARITIME_REFERENCE_COLLECTION_ENABLED:-false}"
      BUS_REFERENCE_COLLECTION_ENABLED: "${BUS_REFERENCE_COLLECTION_ENABLED:-false}"
      PORT_GUIDELINE_COLLECTION_ENABLED: "${PORT_GUIDELINE_COLLECTION_ENABLED:-true}"
      FERRY_TIMETABLE_COLLECTION_ENABLED: "${FERRY_TIMETABLE_COLLECTION_ENABLED:-false}"
      FERRY_TIMETABLE_STORAGE_DAYS: "${FERRY_TIMETABLE_STORAGE_DAYS:-10}"
      FERRY_TIMETABLE_COLLECTION_MAX_PROVIDER_CALLS: "${FERRY_TIMETABLE_COLLECTION_MAX_PROVIDER_CALLS:-280}"
      FERRY_TIMETABLE_COLLECTION_INTERVAL_SECONDS: "${FERRY_TIMETABLE_COLLECTION_INTERVAL_SECONDS:-2}"
      FERRY_TIMETABLE_CACHE_SECONDS: "${FERRY_TIMETABLE_CACHE_SECONDS:-300}"
      FERRY_TIMETABLE_CACHE_MAX_ENTRIES: "${FERRY_TIMETABLE_CACHE_MAX_ENTRIES:-500}"
      FERRY_TIMETABLE_MIN_INTERVAL_SECONDS: "${FERRY_TIMETABLE_MIN_INTERVAL_SECONDS:-30}"
      FERRY_TIMETABLE_MAX_DAYS_AHEAD: "${FERRY_TIMETABLE_MAX_DAYS_AHEAD:-9}"
      BUS_TIMETABLE_CACHE_SECONDS: "${BUS_TIMETABLE_CACHE_SECONDS:-900}"
      BUS_TIMETABLE_CACHE_MAX_ENTRIES: "${BUS_TIMETABLE_CACHE_MAX_ENTRIES:-500}"
      BUS_TIMETABLE_MIN_INTERVAL_SECONDS: "${BUS_TIMETABLE_MIN_INTERVAL_SECONDS:-900}"
      TRANSPORT_STATISTICS_CACHE_SECONDS: "${TRANSPORT_STATISTICS_CACHE_SECONDS:-60}"
      TRANSPORT_STATISTICS_MAX_CONCURRENT_MISSES: "${TRANSPORT_STATISTICS_MAX_CONCURRENT_MISSES:-2}"
      TRANSPORT_STATISTICS_TIMEOUT_SECONDS: "${TRANSPORT_STATISTICS_TIMEOUT_SECONDS:-20}"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${PUBLIC_API_PORT:-14001}/health', timeout=5).read()"]

  # 옛 전용 Dagster instance의 run/event/schedule storage schema(application Alembic과 별개). 공용
  # instance의 schema는 Manager의 storage migrate one-shot만 만든다. 옛 DB(30일 보존)용으로 legacy-dagster에 남는다.
  dagster-migrate:
    image: "${BACKEND_RUNTIME_IMAGE:-kor-travel-transport-backend:latest}"
    profiles: [legacy-dagster]
    restart: "no"
    network_mode: host
    command: ["dagster", "instance", "migrate"]
    environment:
      <<: *dagster-control-environment
    extra_hosts: !reset []

  migrate:
    image: "${BACKEND_RUNTIME_IMAGE:-kor-travel-transport-backend:latest}"
    restart: "no"
    network_mode: host
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: "${DATABASE_URL:?set the application database DSN}"
      RUN_DB_MIGRATIONS: "false"
    extra_hosts: !reset []

  # 이 컨테이너만 job 모듈을 import하고 run worker를 실행한다. 공용 webserver·daemon은
  # workspace gRPC(`127.0.0.1:14005`, host network)로만 연결한다.
  #
  # 공용 plane 합류 계약(Manager ADR-54):
  # - `dagster code-server start`다(`dagster api grpc`가 아니다). 공용 webserver의 location reload가
  #   ReloadCode로 정의를 다시 import하게 한다 — `api grpc`는 reload를 무시한다(Manager
  #   `fix/dagster-code-server-reloadable`, 2026-10-01 n150 실측).
  # - `--location-name kor-travel-transport`: 옛 workspace의 location 이름 그대로다. 공용 workspace가 같은
  #   이름으로 싣고, run의 `dagster/code_location` tag(공용 instance의 테넌트 상한 key)와 schedule selector
  #   id가 이 이름에서 나온다.
  # - gRPC는 127.0.0.1에서만 듣는다(인증이 없다). `-p`는 literal이다 — 공용 workspace가 이 값을 싣는다.
  # - `$DAGSTER_HOME/dagster.yaml`은 Manager의 공용 instance 정의(`config/dagster-shared/dagster.yaml`)를
  #   읽기 전용으로 덮는다. run worker는 공용 daemon이 넘긴 instance ref로 돌지만, code-server 자신의
  #   instance(`--inject-env-vars-from-instance`)도 같은 공용 instance여야 옛 DB에 닿지 않는다. 공용
  #   instance의 로컬 쓰기(`/opt/dagster/state`)는 이 컨테이너 안에서 풀린다(root라 쓸 수 있다).
  # - 옛 metadata DSN(`DAGSTER_POSTGRES_URL`)은 받지 않는다.
  dagster-code-server:
    image: "${BACKEND_RUNTIME_IMAGE:-kor-travel-transport-backend:latest}"
    restart: unless-stopped
    network_mode: host
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *dagster-execution-environment
      # `code-server start`의 proxy→자식 heartbeat — Manager 공용 code-server와 같은 600초(Manager #456: 기본 30초는
      # n150 디스크 대기 급등에 짧아 멀쩡한 자식이 내려간다). 전환 스크립트가 Manager 값과 대조한다.
      DAGSTER_GRPC_PROXY_HEARTBEAT_TTL_SECONDS: "600"
    volumes:
      - "${KOR_TRAVEL_DAGSTER_SHARED_INSTANCE_CONFIG:-/opt/kor-travel-docker-manager/config/dagster-shared/dagster.yaml}:/app/dagster_home/dagster.yaml:ro"
    extra_hosts: !reset []
    command: ["dagster", "code-server", "start", "-h", "127.0.0.1", "-p", "14005", "-m", "app.dagster.definitions", "--location-name", "kor-travel-transport", "--inject-env-vars-from-instance"]
    # PID 1인 dagster는 healthcheck·exec가 남긴 고아를 거두지 않는다. init이 PID 1이 되어 거둔다
    # (2026-09-27 n150 Dagster 컨테이너 좀비 565개, Manager #426·Map #1284와 같은 계약).
    init: true
    healthcheck:
      # 공용 probe(`x-dagster-code-server-probe`, 위 — Manager 원문 그대로). exec 형식·`python -I`, 마지막 인자는 위
      # command의 `-p` 포트다. 자식이 죽거나 멈추면 init(PID 1)을 끝내 `restart`가 다시 띄운다.
      test:
        - CMD
        - python
        - -I
        - -c
        - *dagster-code-server-probe
        - "14005"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
      start_interval: 5s

  # ── 옛 전용 Dagster(legacy-dagster) ─────────────────────────────────────────────
  # 공용 plane 합류로 내려갔다. 평소 `up`은 띄우지 않는다. Manager 전환 스크립트가 모양으로 찾아 펜스한다.
  # 이 서비스들을 이 profile로 직접 띄우지 않는다 — 공용 daemon이 같은 schedule을 이미 쏜다(이중 발화).
  dagster-webserver:
    image: "${BACKEND_RUNTIME_IMAGE:-kor-travel-transport-backend:latest}"
    profiles: [legacy-dagster]
    restart: unless-stopped
    network_mode: host
    depends_on:
      migrate:
        condition: service_completed_successfully
      dagster-migrate:
        condition: service_completed_successfully
      dagster-code-server:
        condition: service_healthy
    environment:
      <<: *dagster-control-environment
    extra_hosts: !reset []
    command: ["dagster-webserver", "-h", "127.0.0.1", "-p", "14004", "-w", "/app/dagster_home/workspace.yaml"]
    init: true
    healthcheck:
      # exec 형식 + `python -I`(작업 디렉터리·PYTHON* env가 probe의 import를 가리지 않게 한다).
      test: ["CMD", "python", "-I", "-c", "import json, urllib.request as u; q=json.dumps({'query':'{repositoriesOrError{__typename}}'}).encode(); r=u.urlopen(u.Request('http://127.0.0.1:14004/graphql', data=q, headers={'Content-Type':'application/json'}), timeout=5); raise SystemExit(0 if json.load(r).get('data', {}).get('repositoriesOrError', {}).get('__typename') == 'RepositoryConnection' else 1)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  dagster-daemon:
    image: "${BACKEND_RUNTIME_IMAGE:-kor-travel-transport-backend:latest}"
    profiles: [legacy-dagster]
    restart: unless-stopped
    network_mode: host
    depends_on:
      migrate:
        condition: service_completed_successfully
      dagster-migrate:
        condition: service_completed_successfully
      dagster-code-server:
        condition: service_healthy
    environment:
      <<: *dagster-control-environment
      DAGSTER_DAEMON_HEARTBEAT_TOLERANCE: "300"
    extra_hosts: !reset []
    command: ["dagster-daemon", "run", "-w", "/app/dagster_home/workspace.yaml"]
    init: true
    healthcheck:
      # dagster의 정식 판정. 매번 dagster를 import하고 metadata DB까지 왕복한다(n150 부하 때 10초 초과
      # 실측) — timeout을 60초로 두고 주기를 늘려 probe가 부하를 키우지 않게 한다.
      # 끼인 daemon이 unhealthy로 보이기까지 최악 30s(heartbeat 주기) + 300s(위 tolerance) +
      # 60s(진행 중이던 probe) + 2 × (120s + 60s) = 750s다. docker는 이전 probe가 끝난 뒤에야
      # interval을 다시 센다. docker는 unhealthy를 재시작하지 않으므로 이 시간을 기다리는 쪽은 없다.
      test: ["CMD", "dagster-daemon", "liveness-check"]
      interval: 120s
      timeout: 60s
      retries: 2
      start_period: 60s
      start_interval: 15s

  dagster-gateway:
    build:
      context: .
      dockerfile: backend/Dockerfile.dagster-gateway
    profiles: [legacy-dagster]
    restart: unless-stopped
    network_mode: host
    depends_on:
      dagster-webserver:
        condition: service_healthy
    environment:
      DAGSTER_UI_USER: "${DAGSTER_UI_USER:-admin}"
      DAGSTER_UI_PASSWORD: "${DAGSTER_UI_PASSWORD:?set the Dagster gateway password}"
    networks: !reset []
    ports: !reset []

  frontend:
    network_mode: host
    networks: !reset []
    ports: !reset []
    command: ["./node_modules/.bin/next", "start", "--hostname", "0.0.0.0", "--port", "${PUBLIC_WEB_PORT:-14002}"]
    environment:
      BACKEND_INTERNAL_URL: "http://127.0.0.1:${PUBLIC_API_PORT:-14001}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:${PUBLIC_WEB_PORT:-14002}/').then((r) => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"]

networks:
  kor-travel-transport-net:
    external: true
