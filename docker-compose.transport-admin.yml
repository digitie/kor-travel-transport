name: kor-travel-transport

# 기본 `kor-travel-transport` project의 host-network UI/gateway 서비스다. backend,
# Dagster webserver를 재기동하거나 포트를 변경하지 않고 loopback upstream만 읽는다.
#
# Dagster는 공용 제어 평면(kor-travel-docker-manager ADR-54)이다. UI는 공용 webserver
# (`127.0.0.1:11002`)에 이 location(`kor-travel-transport`)으로 좁힌 이름 붙은 query만 보낸다
# (`lib/dagster-scope.ts`). 외부 Dagster UI는 공용 gateway(`dagster.digitie.mywire.org`)다 — 이 스택의
# 옛 `transport-dagster-gateway`(12302, transport-dagster.digitie.mywire.org)는 없어졌다(redirect 없음).
services:
  transport-api-gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    network_mode: host
    environment:
      TRANSPORT_PUBLIC_API_PORT: "${TRANSPORT_PUBLIC_API_PORT:-12301}"
      TRANSPORT_EXPORT_CONSUMER_CIDR: "${TRANSPORT_EXPORT_CONSUMER_CIDR:-}"
    volumes:
      - ./deploy/transport-admin/api-gateway.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./deploy/transport-admin/19-export-allowlist.sh:/docker-entrypoint.d/19-export-allowlist.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${TRANSPORT_PUBLIC_API_PORT:-12301}/health >/dev/null"]
      interval: 45s
      timeout: 5s
      retries: 5

  transport-admin-web:
    build:
      context: .
      dockerfile: packages/kor-travel-transport-admin/frontend/Dockerfile
      args:
        TRANSPORT_ADMIN_RELEASE_SHA: "${TRANSPORT_ADMIN_RELEASE_SHA:-unknown}"
        NEXT_PUBLIC_TRANSPORT_DAGSTER_URL: "${NEXT_PUBLIC_TRANSPORT_DAGSTER_URL:-https://dagster.digitie.mywire.org}"
        NEXT_PUBLIC_VWORLD_API_KEY: "${NEXT_PUBLIC_VWORLD_API_KEY:?set the VWorld browser key}"
    restart: unless-stopped
    network_mode: host
    environment:
      TRANSPORT_API_INTERNAL_URL: "${TRANSPORT_API_INTERNAL_URL:-http://127.0.0.1:12302}"
      # 공용 Dagster webserver의 loopback(인증 없음). 옛 전용 webserver(14004)는 legacy-dagster로 내려갔다.
      TRANSPORT_DAGSTER_INTERNAL_URL: "${TRANSPORT_DAGSTER_INTERNAL_URL:-http://127.0.0.1:11002}"
      TRANSPORT_UI_USER: "${TRANSPORT_UI_USER:-admin}"
      TRANSPORT_UI_PASSWORD: "${TRANSPORT_UI_PASSWORD:?set the transport admin password}"
      TRANSPORT_UI_SESSION_SECRET: "${TRANSPORT_UI_SESSION_SECRET:?set a 32+ character transport admin session secret}"
      TRANSPORT_ADMIN_WRITE_TOKEN: "${TRANSPORT_ADMIN_WRITE_TOKEN:-}"
      TRANSPORT_UI_PUBLIC_ORIGIN: "${TRANSPORT_UI_PUBLIC_ORIGIN:?set the public transport admin origin}"
      TRANSPORT_UI_TRUST_PROXY: "${TRANSPORT_UI_TRUST_PROXY:-false}"
      TRANSPORT_PUBLIC_WEB_PORT: "${TRANSPORT_PUBLIC_WEB_PORT:-12305}"
    command: ["sh", "-c", "npm run start -- --hostname 0.0.0.0 --port ${TRANSPORT_PUBLIC_WEB_PORT:-12305}"]
    depends_on:
      transport-api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "const started=process.hrtime.bigint(),http=require('node:http');let request,response,timer,done=false,size=0;const remaining=()=>4000-Number(process.hrtime.bigint()-started)/1e6;const finish=code=>{if(done)return;done=true;if(code===0&&remaining()<=0)code=1;clearTimeout(timer);response?.destroy();request?.destroy();process.exitCode=code;};timer=setTimeout(()=>finish(1),Math.max(0,remaining()));try{request=http.get('http://127.0.0.1:${TRANSPORT_PUBLIC_WEB_PORT:-12305}/login',{agent:false,headers:{Connection:'close'}},r=>{response=r;r.on('error',()=>finish(1));r.on('aborted',()=>finish(1));r.on('close',()=>{if(!r.complete)finish(1);});if(!Number.isInteger(r.statusCode)||r.statusCode<200||r.statusCode>=300){finish(1);return;}const length=r.headers['content-length'];if(length!==undefined&&(!length.length||Number(length)>1048576||!Array.from(length).every(c=>c>='0'&&c<='9'))){finish(1);return;}r.on('data',chunk=>{size+=chunk.length;if(size>1048576)finish(1);});r.on('end',()=>finish(r.complete&&!r.aborted?0:1));});request.on('error',()=>finish(1));}catch{finish(1);}"]
      interval: 45s
      timeout: 5s
      retries: 5
      start_period: 20s
