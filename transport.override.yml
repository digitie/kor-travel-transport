# Odroid의 공용 Dagster workspace/Manager registry는 transport location을 12306에 연결한다.
# docker-compose.shared.yml은 n150 호환 기본값 14005를 유지하고, Odroid 배포가 이 파일을
# /opt/kor-travel-odroid/transport/transport.override.yml에 설치해 명시적으로 함께 읽는다.
x-dagster-code-server-probe: &dagster-code-server-probe |-
  import os, sys, time, subprocess
  mark, tried, fails, passed = '/tmp/.ktdm-orphan-reap', '/tmp/.ktdm-orphan-reap.tried', '/tmp/.ktdm-probe-fails', '/tmp/.ktdm-probe-passed'
  born = open('/proc/1/stat').read().rsplit(')', 1)[1].split()[19]
  key = open('/proc/sys/kernel/random/boot_id').read().strip() + ':' + born
  def write(path, text):
      new = '%s.%d.%s' % (path, os.getpid(), os.urandom(4).hex())
      with open(new, 'w') as f:
          f.write(text)
      os.replace(new, path)
  if sys.argv[2:] == ['reap']:
      import fcntl
      lock = open(mark + '.lock', 'w')
      try:
          fcntl.flock(lock, fcntl.LOCK_EX | fcntl.LOCK_NB)
      except OSError:
          sys.exit(0)
      argv = open('/proc/1/cmdline').read().split('\0')
      def flag(*names):
          for i, w in enumerate(argv):
              for name in names:
                  if w == name and i + 1 < len(argv):
                      return argv[i + 1]
                  if w.startswith(name + '='):
                      return w[len(name) + 1:]
      location = flag('--location-name', '-l') or flag('-m', '--module-name')
      if not location:
          print('orphan reaper: PID 1 argv names no code location; nothing to reap', flush=True)
      else:
          from dagster import DagsterInstance
          from dagster._core.storage.dagster_run import DagsterRunStatus, RunsFilter
          since = time.time() - float(open('/proc/uptime').read().split()[0]) + int(born) / os.sysconf('SC_CLK_TCK')
          instance = DagsterInstance.get()
          for record in instance.get_run_records(filters=RunsFilter(statuses=[DagsterRunStatus.STARTED], tags={'dagster/code_location': location})):
              if record.start_time is not None and record.start_time < since:
                  instance.report_run_failed(record.dagster_run, 'run worker lost: this code server container restarted after the run started')
                  print('orphan run failed:', record.dagster_run.run_id, flush=True)
      write(mark, key)
      sys.exit(0)
  import grpc
  from grpc_health.v1 import health_pb2 as h, health_pb2_grpc as g
  now = time.monotonic()
  seen_healthy = os.path.exists(passed) and open(passed).read() == key
  c = grpc.insecure_channel('127.0.0.1:' + sys.argv[1])
  def kind_of(e):
      return 'timeout' if e.code() == grpc.StatusCode.DEADLINE_EXCEEDED else str(e.code())
  try:
      r = g.HealthStub(c).Check(h.HealthCheckRequest(service='DagsterApi'), timeout=4)
      kind = None if r.status == h.HealthCheckResponse.SERVING else 'NOT_SERVING'
  except grpc.RpcError as e:
      kind = kind_of(e)
  if kind and not seen_healthy:
      sys.exit(1)
  if not kind:
      try:
          kind = 'load error' if b'SerializableErrorInfo' in c.unary_unary('/api.DagsterApi/ListRepositories')(b'', timeout=4) else None
      except grpc.RpcError as e:
          kind = kind_of(e)
  if kind:
      try:
          k, count, first, down, clock = open(fails).read().split()
          if k != key or clock != 'monotonic':
              raise ValueError(k)
          count, first = int(count) + 1, float(first)
      except (OSError, ValueError):
          count, first, down = 1, now, '-'
      down = '-' if kind == 'load error' else (down if down != '-' else str(now))
      write(fails, ' '.join((key, str(count), str(first), down, 'monotonic')))
      print('child', kind, 'x' + str(count), file=sys.stderr)
      def runs_in_flight():
          for pid in os.listdir('/proc'):
              try:
                  if pid.isdigit() and any(arg.startswith(b'from multiprocessing.spawn import spawn_main') for arg in open('/proc/' + pid + '/cmdline', 'rb').read().split(b'\0')):
                      return True
              except OSError:
                  pass
          return False
      down_for = now - float(down) if down != '-' else 0.0
      if kind == 'load error':
          due = now - first >= 90
      elif kind == 'timeout':
          due = down_for >= (300 if seen_healthy else 1800)
      else:
          due = down_for >= 90
      if count >= 3 and due and (down_for >= 7200 or not runs_in_flight()):
          os.kill(1, 15)
      sys.exit(1)
  os.path.exists(fails) and os.remove(fails)
  seen_healthy or write(passed, key)
  if (not os.path.exists(mark) or open(mark).read() != key) and (not os.path.exists(tried) or time.time() - os.path.getmtime(tried) >= 300):
      open(tried, 'w').close()
      log = open('/proc/1/fd/2', 'w')
      subprocess.Popen([sys.executable, '-I', '-c', sys.orig_argv[sys.orig_argv.index('-c') + 1], sys.argv[1], 'reap'], start_new_session=True, stdin=subprocess.DEVNULL, stdout=log, stderr=log)

services:
  dagster-code-server:
    command:
      - dagster
      - code-server
      - start
      - -h
      - 127.0.0.1
      - -p
      - "12306"
      - -m
      - app.dagster.definitions
      - --location-name
      - kor-travel-transport
      - --inject-env-vars-from-instance
    healthcheck:
      test:
        - CMD
        - python
        - -I
        - -c
        - *dagster-code-server-probe
        - "12306"
