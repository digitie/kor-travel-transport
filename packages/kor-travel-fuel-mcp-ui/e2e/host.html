<!doctype html><html lang="ko"><meta charset="utf-8"><title>MCP Apps 통합 시험 호스트</title><style>body{margin:0}iframe{border:0;width:100%;height:1600px}</style><iframe id="widget" title="내 주변 유가" src="/widget" sandbox="allow-scripts" allow="geolocation"></iframe><script>
const frame=document.getElementById("widget");window.calls=[];window.opened=[];
const query={latitude:37.5,longitude:127,radius_m:5000,sort_by:"price"};
function result(q=query,scope="radius") {const row=(n,code)=>({station_key:String(n),name:n===1?"금남주유소":"유가 주유소 "+n,address:n===1?"서울특별시 종로구 시험로 1":"서울특별시 종로구 시험로 "+n,brand_name:"S-OIL",latitude:q.latitude+n*.001,longitude:q.longitude+n*.001,price:1500+n*10+["B027","D047","B034","K015","C004"].indexOf(code)*10,distance_m:n*120});const products=["B027","D047","B034","K015","C004"].map((code,i)=>({product_code:code,product_name:code,station_count:42,average_price:1715+i*10,minimum_price:1510+i*10,cheapest_station_count:1,cheapest_stations:[row(1,code)],ranked_stations:Array.from({length:20},(_,n)=>row(n+1,code)),truncated:false,ranking_truncated:true}));return {scope,latitude:q.latitude,longitude:q.longitude,radius_m:q.radius_m,sort_by:q.sort_by,products,collection:{status:"ready",generated_at:"2026-11-28T00:00:00Z",last_success_at:"2026-11-28T00:00:00Z",stale:false,update_pending:false,last_attempt_failed:false},region:scope==="sigungu"?{status:"resolved",label:"서울 종로구"}:null};}
window.sample=result;
const send=m=>frame.contentWindow.postMessage({jsonrpc:"2.0",...m},"*");
window.sendResult=r=>send({method:"ui/notifications/tool-result",params:{structuredContent:r,content:[]}});
window.addEventListener("message",event=>{if(event.source!==frame.contentWindow)return;const m=event.data;if(m.method==="ui/initialize"){send({id:m.id,result:{protocolVersion:m.params.protocolVersion,hostInfo:{name:"transport-test",version:"1"},hostCapabilities:{serverTools:{},openLinks:{}},hostContext:{theme:"light",displayMode:"inline",locale:"ko-KR"}}});}
else if(m.method==="ui/notifications/initialized"){send({method:"ui/notifications/tool-input",params:{arguments:{query}}});window.sendResult(result());}
else if(m.method==="tools/call"){window.calls.push(m.params);if(window.failNext){window.failNext=false;send({id:m.id,result:{content:[{type:"text",text:"private-upstream-error"}],isError:true}});}else send({id:m.id,result:{content:[],structuredContent:result(m.params.arguments.query,m.params.name==="get_regional_fuel_prices"?m.params.arguments.query.scope:"radius")}});}
else if(m.method==="ui/open-link"){window.opened.push(m.params.url);send({id:m.id,result:{}});}
else if(m.id!==undefined){send({id:m.id,result:{}});}});
</script></html>
